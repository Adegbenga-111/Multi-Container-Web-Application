
name: First Automated Test

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Run a simple test
        run: |
          EXPECTED=4
          ACTUAL=$((2 + 2))

          echo "Expected: $EXPECTED"
          echo "Actual: $ACTUAL"

          test "$ACTUAL" -eq "$EXPECTED"

      - name: Report success
        if: success()
        run: echo "All checks passed!"

      - name: Report failure
        if: failure()
        run: echo "The test failed. Check the logs."
