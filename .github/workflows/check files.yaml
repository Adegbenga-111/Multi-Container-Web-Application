
name: Project File Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file
        run: test -f dockp1/frontend/html/index.html

      - name: Check CSS file
        run: test -f dockp1/frontend/html/styles.css

      - name: Check PHP file
        run: test -f dockp1/backend/src/index.php

      - name: Report successful validation
        if: success()
        run: echo "All required files exist!"

      - name: Report missing files
        if: failure()
        run: echo "One or more required files are missing!"
