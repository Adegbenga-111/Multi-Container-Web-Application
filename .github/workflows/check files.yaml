
name: Project CI

on:
  push:
  pull_request:

jobs:
  file_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file
        run: test -f dockp1/frontend/html/index.html

      - name: Check CSS file
        run: test -f dockp1/frontend/html/styles.css

  php_check:
    needs: file_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        run: php -l dockp1/backend/scr/index.php
