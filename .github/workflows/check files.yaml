name: Project CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create validation report
        run: |
          mkdir -p reports
          echo "Project validation workflow completed." > reports/validation.txt
          echo "Repository: $GITHUB_REPOSITORY" >> reports/validation.txt
          echo "Commit: $GITHUB_SHA" >> reports/validation.txt

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/validation.txt
          retention-days: 7