
name: PHP Syntax Check

on:
  push:
  pull_request:

jobs:
  php-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -print0 |
          xargs -0 -r -n1 php -l
