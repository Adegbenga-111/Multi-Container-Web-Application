
name: Job Outputs Demo

on:
  push:
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      project_dir: ${{ steps.set_dir.outputs.project_dir }}

    steps:
      - name: Set project directory
        id: set_dir
        run: echo "project_dir=dockp1" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check frontend directory
        run: test -d "${{ needs.prepare.outputs.project_dir }}/frontend"

      - name: Show project directory
        run: echo "Project directory received successfully."
