
name: Environment Variables Exercise

on: push

jobs:
  learn-variables:
    runs-on: ubuntu-latest

    env:
      STUDENT_NAME: Gbenga
      LEARNING_PATH: Cloud and DevOps
      MY_NAME: Adelaja Gbenga Ayomide
      MY_GOAL: Cloud/DevOps Engineer
    steps:
      - name: Display student name
        run: echo "My name is $STUDENT_NAME"

      - name: Display learning path
        run: echo "I am learning $LEARNING_PATH"

      - name: Display both variables
        run: echo "$STUDENT_NAME is learning $LEARNING_PATH"

      - name: Display variable using MY_NAME
        run: echo "My name is $MY_NAME"
      
      - name: Display variable using MY_GOAL
        run: echo "My goal is to become a $MY_GOAL"