
name: File Check

on: push

jobs:
  check-file:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Check if README exists
        run: test -f README.md

      - name: Report success
        if: success()
        run: echo "README.md exists!"

      - name: Report failure
        if: failure()
        run: echo "The file check failed."
