
name: File Check

on: push

jobs:
  check-file:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Check if README exists
        run: test -f README.md

      - name: Check if Dockercompose file exists
        run: test -f docker-compose.yml 

      - name: Report success
        if: success()
        run: echo "All file checks passed!"

      - name: Report failure
        if: failure()
        run: echo "All or Some files are missing."
