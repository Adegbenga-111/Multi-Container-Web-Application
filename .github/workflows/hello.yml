
name: Conditional Execution

on: push

jobs:
  conditional-job:
    runs-on: ubuntu-latest

    steps:
      - name: Start message
        run: echo "Starting my CI/CD journey"

      - name: Success message
        if: github.ref == 'refs/heads/main'
        run: echo "The build is successful"

      - name: Failure message
        if: github.ref != 'refs/heads/main'
        run: echo "The build has failed"
