name: Main Branch Exercise

on: push

jobs:
  check-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check the branch
        if: github.ref == 'refs/heads/main'
        run: echo "This push is on the main branch!"

      - name: Check other branches
        if: github.ref != 'refs/heads/main'
        run: echo "This push is on a different branch."
